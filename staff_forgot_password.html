<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Forgot Password - CyberInvestigate AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="logo-row">
        {% include "_logo.html" %}
        <h1>Manage Staff Accounts</h1>
        <div class="subtitle">Verify the owner's phone number to continue</div>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('staff_forgot_password') }}">
        <label for="phone_number">Owner Phone Number</label>
        <input type="tel" id="phone_number" name="phone_number" placeholder="10-digit mobile number" required autofocus>
        <button type="submit" class="btn btn-primary">Send OTP</button>
      </form>

      <div class="demo-hint">
        <a href="{{ url_for('staff_login') }}" style="color:var(--neon); font-weight:600;">Back to Staff Login</a>
      </div>
    </div>
  </div>
</body>
</html>
